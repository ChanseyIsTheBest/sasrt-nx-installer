sasrt_gpu_cut_depth_alias = false          # 54 CHANGES PIXELS: light and composite passes test the G-buffer's own depth
sasrt_gpu_cut_restore_copy_drop = false    # 55 CHANGES PIXELS: a restore copy left out is never drawn
