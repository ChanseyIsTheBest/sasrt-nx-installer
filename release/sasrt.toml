# sasrt-nx (2026-11-08, the user's request): banjo-nx's SMAA in place of the game's FXAA. SMAA runs on the 1152x544
# composite (pixel shader 2414CA963766CE4E) and the FXAA pass becomes its centre sample (sasrt_smaa_replaces_fxaa:
# a plain upscale to 1280x720). configs/sasrt_fxaa_game.toml: the game's FXAA as before.
# 2026-11-09 (the user: "anti-aliasing only pops up a couple of seconds after the race starts"): the race's first
# seconds (and the menus) draw the composite without bloom, 670FBDA9D99C678B (the same tonemap and grading, one target),
# and switch to 2414CA96 a few seconds in (run W's profile: 670FBDA9 until 10:16:33, then 2414CA96): SMAA after both.
# sasrt-nx (2026-11-13, the base sync): base port 118 made msaa_level 1 the default (4 before). This game's races
# make no multisampled target either way; 4 keeps what every run so far had.
msaa_level = 4
# sasrt-nx (2026-11-13, the base sync; console races c1113_sync2 / _sync3): two base keys that add work to every
# queued op / converted stream and never act in this game: Blur's stack surface headers (port 76, key 215: this port's
# own surface capture covers it) and Dishonored's committed-memory check on vertex fills (port 101: a heap lock and a
# page walk per fill, for a fault this game never had). Off: render thread 19.65 -> 19.23 ms a frame, process CPU
# -1.3 %, the same as cycle C's.
blur_renut_stack_surface_headers = false
dishonored_renut_vertex_readable_check = false
banjo_renut_smaa = true
banjo_renut_smaa_after_ps = "2414CA963766CE4E,670FBDA9D99C678B"
sasrt_smaa_replaces_fxaa = true

# Dynamic resolution (banjo's, the user's request 2026-11-09: handheld 480p to 720p, docked 540p to 1080p). The 3D
# image's height follows the GPU's time a frame (a moving average against banjo_renut_dynamic_gpu_ms, 34.5 ms: down at
# once, up after 1 s of fitting), in steps between the ends (multiples of 36 lines): handheld 477 (480 rounded to a
# multiple of 9) 540 576 612 684 720, docked 540 648 756 864 972 1080. The HUD and menus stay at the display's size
# (docked: the swapchain at 1920x1080). Not pixel-identical while it is below 720. At a scale other than 1x the light pass
# and the composite test against the G-buffer's own depth (the EDRAM depth restore assumes 1x; render/draw.cpp).
banjo_renut_dynamic_resolution = true
